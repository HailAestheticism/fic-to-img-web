<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>文转长图 · 粘贴文字，导出长图</title>
    <meta
      name="description"
      content="把 Markdown 文本一键排版成 1080px 手机长图的纯网页工具，支持全文一图与按章节多图导出。"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/prose.css" />
  </head>
  <body>
    <!-- 工具栏图标（内置 sprite，零外部依赖；stroke 由 .ic 继承 currentColor） -->
    <svg id="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
      <symbol id="i-align-left" viewBox="0 0 24 24">
        <path d="M4 6h16M4 10h10M4 14h16M4 18h10" />
      </symbol>
      <symbol id="i-align-center" viewBox="0 0 24 24">
        <path d="M4 6h16M7 10h10M4 14h16M6 18h12" />
      </symbol>
      <symbol id="i-align-right" viewBox="0 0 24 24">
        <path d="M4 6h16M10 10h10M4 14h16M10 18h10" />
      </symbol>
      <symbol id="i-align-justify" viewBox="0 0 24 24">
        <path d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </symbol>
      <symbol id="i-indent" viewBox="0 0 24 24">
        <path d="M4 5h16M11 9.5h9M11 14.5h9M4 19h16" />
        <path d="M4.5 9.5l3 2.5-3 2.5" />
      </symbol>
      <symbol id="i-outdent" viewBox="0 0 24 24">
        <path d="M4 5h16M7 9.5h13M7 14.5h13M4 19h16" />
        <path d="M19.5 9.5l-3 2.5 3 2.5" />
      </symbol>
      <symbol id="i-ul" viewBox="0 0 24 24">
        <path d="M9 6h11M9 12h11M9 18h11" />
        <path d="M4.6 6h.01M4.6 12h.01M4.6 18h.01" stroke-width="2.8" />
      </symbol>
      <symbol id="i-ol" viewBox="0 0 24 24">
        <path d="M10 6.5h10M10 16.5h10" />
        <text x="1.6" y="9.4" font-size="8" font-weight="700" fill="currentColor" stroke="none">1</text>
        <text x="1.6" y="19.4" font-size="8" font-weight="700" fill="currentColor" stroke="none">2</text>
      </symbol>
      <symbol id="i-quote" viewBox="0 0 24 24">
        <text
          x="2.5"
          y="19.5"
          font-size="22"
          font-weight="700"
          font-family="Georgia, 'Times New Roman', serif"
          fill="currentColor"
          stroke="none"
        >
          &ldquo;
        </text>
      </symbol>
      <symbol id="i-hr" viewBox="0 0 24 24">
        <path d="M3 12h18" />
        <path d="M6 6h12M6 18h12" opacity="0.35" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M9.5 14.5l5-5" />
        <path d="M11 6.5l1.6-1.6a3.6 3.6 0 0 1 5.1 5.1L16 11.5" />
        <path d="M13 17.5l-1.6 1.6a3.6 3.6 0 0 1-5.1-5.1L8 12.5" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="14" rx="2.5" />
        <path d="M4.5 16.5l4.5-4.5 4 4 3-3 4 4" />
        <path d="M9 9.5h.01" stroke-width="3" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z" />
        <path d="M13.5 3.5v5h5" />
        <path d="M9 13.5h6M9 17h4" />
      </symbol>
    </svg>
    <header>
      <div class="brand">文转长图<small>粘贴文本 → 排版 → 导出图片</small></div>
      <div class="spacer"></div>
      <!-- 导入文档：放在页面右上角（原先显示画布宽度的位置，画布宽度不再显示） -->
      <button class="import-btn" id="importBtn" type="button" title="导入 .md / .txt 文档，自动识别 Markdown">
        <svg class="ic"><use href="#i-file" /></svg><span>导入文档</span>
      </button>
      <input id="fileInput" type="file" accept=".md,.markdown,.txt" hidden />
    </header>

    <main>
      <!-- 中：所见即所得排版面（直接编辑；窄屏时缩放到与页面等宽） -->
      <div id="leftCol">
        <div id="previewCol">
          <div id="previewSized">
            <div id="previewScaler">
              <div class="long-wrap" id="paperWrap">
                <div class="tiptap-prose title-flow" id="titleFlow" contenteditable="true" spellcheck="false"></div>
                <div class="tiptap-prose paged-flow" id="paperFlow" contenteditable="true" spellcheck="false"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 格式栏（宽屏：右列导出区上方；窄屏：固定顶端、可折叠） -->
      <div id="rightCol">
        <div class="tools-card" id="mdTools">
          <div class="tools-head">
            <button class="area-toggle" id="toolsToggle" type="button" aria-expanded="true">格式 ▾</button>
            <div class="tool-tabs" role="tablist">
              <button class="tab on" type="button" role="tab" data-panel="basic" aria-selected="true">基本</button>
              <button class="tab" type="button" role="tab" data-panel="typo" aria-selected="false">排版</button>
            </div>
          </div>
          <div class="tool-panels tool-body" id="toolPanels">
            <div class="tool-track">
              <div class="tool-panel" id="panelBasic">
                <div class="md-tools">
                  <button data-cmd="bold" title="加粗（Ctrl+B）" aria-label="加粗"><b>B</b></button>
                  <button data-cmd="italic" title="斜体（Ctrl+I）" aria-label="斜体"><i>I</i></button>
                  <button
                    data-cmd="underline"
                    title="下划线（Ctrl+U）"
                    aria-label="下划线"
                  ><u>U</u></button>
                  <button data-cmd="strikeThrough" title="删除线" aria-label="删除线"><s>S</s></button>
                  <span class="sep"></span>
                  <button data-cmd="justifyLeft" title="左对齐" aria-label="左对齐">
                    <svg class="ic"><use href="#i-align-left" /></svg>
                  </button>
                  <button data-cmd="justifyCenter" title="居中对齐" aria-label="居中对齐">
                    <svg class="ic"><use href="#i-align-center" /></svg>
                  </button>
                  <button data-cmd="justifyRight" title="右对齐" aria-label="右对齐">
                    <svg class="ic"><use href="#i-align-right" /></svg>
                  </button>
                  <button data-cmd="justifyFull" title="两端对齐" aria-label="两端对齐">
                    <svg class="ic"><use href="#i-align-justify" /></svg>
                  </button>
                  <span class="sep"></span>
                  <button data-cmd="indent" title="增加缩进（两字宽）" aria-label="增加缩进">
                    <svg class="ic"><use href="#i-indent" /></svg>
                  </button>
                  <button data-cmd="outdent" title="减少缩进" aria-label="减少缩进">
                    <svg class="ic"><use href="#i-outdent" /></svg>
                  </button>
                  <span class="sep"></span>
                  <button data-cmd="h1" title="一级标题＝分章边界">H1</button>
                  <button data-cmd="h2" title="二级标题">H2</button>
                  <button data-cmd="h3" title="三级标题">H3</button>
                  <button data-cmd="p" title="正文">正文</button>
                  <span class="sep"></span>
                  <button data-cmd="insertUnorderedList" title="无序列表" aria-label="无序列表">
                    <svg class="ic"><use href="#i-ul" /></svg>
                  </button>
                  <button data-cmd="insertOrderedList" title="有序列表" aria-label="有序列表">
                    <svg class="ic"><use href="#i-ol" /></svg>
                  </button>
                  <button data-cmd="blockquote" title="引用" aria-label="引用">
                    <svg class="ic"><use href="#i-quote" /></svg>
                  </button>
                  <button data-cmd="insertHorizontalRule" title="分割线" aria-label="分割线">
                    <svg class="ic"><use href="#i-hr" /></svg>
                  </button>
                  <span class="sep"></span>
                  <button data-cmd="link" title="插入链接" aria-label="插入链接">
                    <svg class="ic"><use href="#i-link" /></svg>
                  </button>
                  <button data-cmd="image" title="插入图片（外链需允许跨域）" aria-label="插入图片">
                    <svg class="ic"><use href="#i-image" /></svg>
                  </button>
                </div>
              </div>
              <!-- 排版参数：字号 / 行距 / 段距 / 字距 + 四边页边距（单位 px 写在标签里） -->
              <div class="tool-panel" id="panelTypo">
                <div class="type-tools">
                  <div class="ty-grid">
                    <label class="ty"><span>字号(px)</span><input type="number" data-typo="bodySize" /></label>
                    <label class="ty"><span>行间距(px)</span><input type="number" data-typo="linePx" /></label>
                    <label class="ty"><span>段间距(px)</span><input type="number" data-typo="paraGapPx" /></label>
                    <label class="ty"><span>字间距(px)</span><input type="number" data-typo="letterSpacingPx" /></label>
                    <label class="ty"><span>上边距(px)</span><input type="number" data-margin="0" /></label>
                    <label class="ty"><span>下边距(px)</span><input type="number" data-margin="2" /></label>
                    <label class="ty"><span>左边距(px)</span><input type="number" data-margin="3" /></label>
                    <label class="ty"><span>右边距(px)</span><input type="number" data-margin="1" /></label>
                  </div>
                  <button class="ty-reset" id="typoReset" type="button" title="恢复默认字号、间距与页边距">恢复默认排版</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 导出（与编辑完全分离；窄屏：固定底端、设置可折叠，导出按钮常驻） -->
        <div id="exportArea">
          <button class="area-toggle" id="expToggle" type="button" aria-expanded="true">导出 ▾</button>
          <div id="expBody">
            <div class="exp-row">
              <span class="lab">方式</span>
              <label><input type="radio" name="expMode" value="all" checked />全文一图直出</label>
              <label><input type="radio" name="expMode" value="chapter" />分章节多图（按 H1 划分）</label>
            </div>
            <div class="exp-row">
              <span class="lab">清晰度</span>
              <label><input type="radio" name="expQuality" value="original" checked />原图</label>
              <label><input type="radio" name="expQuality" value="hd" />高清</label>
              <label><input type="radio" name="expQuality" value="compressed" />压缩</label>
            </div>
            <div class="exp-row">
              <span class="lab">格式</span>
              <label><input type="radio" name="expFmt" value="png" />PNG</label>
              <label><input type="radio" name="expFmt" value="jpeg" />JPG</label>
              <span id="qualityHint" class="q-hint">1 倍截图 · 无损</span>
            </div>
            <div class="exp-row">
              <span class="lab">大小</span>
              <span id="sizeEstimate" class="size-est">—</span>
            </div>
            <p id="compressWarn" class="ex-warn" hidden></p>
          </div>
          <button id="exportBtn" type="button">导出图片</button>
          <div id="exportHint">直接编辑上方文字；粘贴 Markdown 会自动识别格式。</div>
        </div>

        <div class="stat-card">
          <span id="statChars">0 字</span>
          <span id="statChapters"></span>
        </div>
      </div>
    </main>

    <footer>纯静态页面，所有内容仅在您的浏览器中处理，不会上传。</footer>

    <script src="vendor/html2canvas.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/render.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
